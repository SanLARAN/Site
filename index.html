<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aurora — открытый форум и личное облако-хранилище на GitHub Pages" />
  <meta name="color-scheme" content="dark light" />
  <title>Aurora · Форум и хранилище</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- декоративный фон -->
  <div class="bg-aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="grid-overlay"></span>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/forum" data-nav="forum">
        <span class="brand-mark">
          <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#6366f1"/>
                <stop offset="0.5" stop-color="#a855f7"/>
                <stop offset="1" stop-color="#22d3ee"/>
              </linearGradient>
            </defs>
            <path fill="url(#brandGrad)" d="M16 2c2 6.6 6 10.6 12.6 12.6C22 16.6 18 20.6 16 27.4 14 20.6 10 16.6 3.4 14.6 10 10.6 14 6.6 16 2Z"/>
          </svg>
        </span>
        <span class="brand-name">Aurora</span>
      </a>

      <nav class="mainnav" aria-label="Основная навигация">
        <a href="#/forum" data-nav="forum">
          <svg viewBox="0 0 24 24" class="ic"><path d="M4 5h16v11H9l-5 4V5Z"/></svg>
          Форум
        </a>
        <a href="#/storage" data-nav="storage">
          <svg viewBox="0 0 24 24" class="ic"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
          Хранилище
        </a>
      </nav>

      <div class="topbar-actions">
        <button class="icon-btn theme-toggle" id="themeToggle" title="Переключить тему" aria-label="Переключить тему">
          <svg viewBox="0 0 24 24" class="ic ic-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg viewBox="0 0 24 24" class="ic ic-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <div class="auth-slot" id="authSlot"></div>
      </div>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p><span class="footer-brand">Aurora</span> · форум на GitHub Issues и хранилище в репозитории <a id="footerRepo" href="#" target="_blank" rel="noopener">SanLARAN/Site</a>.</p>
      <p class="footer-sub">Хостится на GitHub Pages. Данные — в вашем репозитории.</p>
    </div>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/forum.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
