<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AURORA — терминал-форум и личное облако-хранилище на GitHub Pages" />
  <meta name="color-scheme" content="dark light" />
  <title>AURORA // форум и хранилище</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>
  <!-- декоративный фон -->
  <div class="bg-aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="grid-overlay"></span>
  </div>

  <!-- CRT-оверлей -->
  <div class="crt" aria-hidden="true">
    <span class="scanlines"></span>
    <span class="noise"></span>
    <span class="vignette"></span>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/forum" data-nav="forum" title="Aurora forum">
        <span class="brand-user">aurora@forum</span><span class="brand-prompt">:</span><span class="brand-path">~</span><span class="brand-prompt">$</span>
        <span class="brand-caret"></span>
      </a>

      <nav class="mainnav" aria-label="Основная навигация">
        <a href="#/forum" data-nav="forum">
          <svg viewBox="0 0 24 24" class="ic"><path d="M4 5h16v11H9l-5 4V5Z"/></svg>
          Форум
        </a>
        <a href="#/storage" data-nav="storage">
          <svg viewBox="0 0 24 24" class="ic"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
          Хранилище
        </a>
      </nav>

      <div class="topbar-actions">
        <button class="icon-btn theme-toggle" id="themeToggle" title="Переключить тему" aria-label="Переключить тему">
          <svg viewBox="0 0 24 24" class="ic ic-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg viewBox="0 0 24 24" class="ic ic-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <div class="auth-slot" id="authSlot"></div>
      </div>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <pre class="ascii-line">┌───────────────────────────────────────────────────────────┐</pre>
      <p><span class="footer-brand">AURORA</span> · форум на GitHub Issues и хранилище в репозитории <a id="footerRepo" href="#" target="_blank" rel="noopener">SanLARAN/Site</a>.</p>
      <p class="footer-sub">▸ хостится на GitHub Pages · данные — в вашем репозитории · v2.0</p>
    </div>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="vendor/marked.min.js?v=6"></script>
  <script src="vendor/purify.min.js?v=6"></script>
  <script src="config.js?v=6"></script>
  <script src="js/api.js?v=6"></script>
  <script src="js/markdown.js?v=6"></script>
  <script src="js/ui.js?v=6"></script>
  <script src="js/profile.js?v=6"></script>
  <script src="js/shop.js?v=6"></script>
  <script src="js/auth.js?v=6"></script>
  <script src="js/forum.js?v=6"></script>
  <script src="js/storage.js?v=6"></script>
  <script src="js/admin.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
